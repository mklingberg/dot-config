# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

exec-on-workspace-change = []

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it fr                om your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
#on-focus-changed = ["move-mouse window-lazy-center"]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        [{ monitor.'^built-in retina display$' = 8 }, 6]
    outer.right =      10

# Modifier model
#   Hyper = Caps Lock via BTT (ctrl-alt-cmd, shift NOT included)
#   hyper          go: focus (hjkl), workspace, layout
#   hyper-shift    take the window along: move (hjkl), send to workspace/monitor
#   hyper-shift-, / .  group (join) with previous / next neighbour
# Focus/move use hjkl under hyper (arrows don't work with BTT hyper+shift); plain ctrl-hjkl stays free for shell/pi/editors.
# Avoid: hyper-v / hyper-c (Vorssaint clipboard / color picker), hyper-shift-s (Vorssaint screenshot),
#        hyper-8 (macOS invert colors).
# BTT gestures call the aerospace CLI directly with matching modifiers.
[mode.main.binding]

    # Focus / move — hjkl, not arrows: BTT's hyper drops shift on arrow keys
    ctrl-alt-cmd-h = 'focus left --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-j = 'focus down --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-k = 'focus up --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-l = 'focus right --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-shift-h = 'move left --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-shift-j = 'move down --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-shift-k = 'move up --boundaries all-monitors-outer-frame'
    ctrl-alt-cmd-shift-l = 'move right --boundaries all-monitors-outer-frame'

    # Group: start a stack with the next/previous neighbour (row → right/left, column → down/up).
    # Once grouped, plain move (hyper-shift-hjkl) moves windows in/out of the stack.
    ctrl-alt-cmd-shift-period = 'exec-and-forget /opt/homebrew/bin/aerospace join-with right || /opt/homebrew/bin/aerospace join-with down'
    ctrl-alt-cmd-shift-comma = 'exec-and-forget /opt/homebrew/bin/aerospace join-with left || /opt/homebrew/bin/aerospace join-with up'

    # Workspaces
    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'
    ctrl-alt-cmd-7 = 'workspace 7'
    ctrl-alt-cmd-8 = 'workspace 8'
    ctrl-alt-cmd-9 = 'workspace 9'
    ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'
    ctrl-alt-cmd-shift-7 = 'move-node-to-workspace 7'
    ctrl-alt-cmd-shift-8 = 'move-node-to-workspace 8'
    ctrl-alt-cmd-shift-9 = 'move-node-to-workspace 9'
    ctrl-alt-cmd-n = 'workspace next --wrap-around'
    ctrl-alt-cmd-p = 'workspace prev --wrap-around'
    ctrl-alt-cmd-shift-n = 'move-node-to-workspace next --wrap-around'
    ctrl-alt-cmd-shift-p = 'move-node-to-workspace prev --wrap-around'
    ctrl-alt-cmd-tab = 'workspace-back-and-forth'

    # Monitors
    ctrl-alt-cmd-o = 'move-workspace-to-monitor --wrap-around next'
    ctrl-alt-cmd-shift-o = 'move-node-to-monitor --wrap-around next'

    # Layout
    ctrl-alt-cmd-f = 'fullscreen'
    ctrl-alt-cmd-shift-f = 'macos-native-fullscreen'
    ctrl-alt-cmd-t = 'layout floating tiling'
    ctrl-alt-cmd-comma = 'layout accordion tiles'
    ctrl-alt-cmd-period = 'layout horizontal vertical'
    ctrl-alt-cmd-b = 'balance-sizes'

    # Resize — trialling both pairs, drop the loser later
    ctrl-alt-cmd-a = 'resize smart +140'      # one hand
    ctrl-alt-cmd-z = 'resize smart -140'
    ctrl-alt-cmd-minus = 'resize smart +140'  # Swedish '+' key
    ctrl-alt-cmd-slash = 'resize smart -140'  # Swedish '-' key

    ctrl-alt-cmd-esc = 'mode service'

# Service mode: hyper-esc to enter; esc/space to leave
[mode.service.binding]
    esc = ['mode main']
    space = ['mode main']
    r = ['reload-config', 'mode main']
    f = ['flatten-workspace-tree', 'mode main'] # reset layout
    t = ['layout floating tiling', 'mode main']
    b = ['balance-sizes', 'mode main']
    m = ['mode main', 'macos-native-fullscreen']
    z = ['exec-and-forget pmset sleepnow', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    s = ['exec-and-forget sketchybar --reload', 'mode main']

    left = 'focus left --boundaries all-monitors-outer-frame'
    down = 'focus down --boundaries all-monitors-outer-frame'
    up = 'focus up --boundaries all-monitors-outer-frame'
    right = 'focus right --boundaries all-monitors-outer-frame'

    shift-left = 'move left --boundaries all-monitors-outer-frame'
    shift-down = 'move down --boundaries all-monitors-outer-frame'
    shift-up = 'move up --boundaries all-monitors-outer-frame'
    shift-right = 'move right --boundaries all-monitors-outer-frame'

    alt-left = ['join-with left', 'mode main']
    alt-down = ['join-with down', 'mode main']
    alt-up = ['join-with up', 'mode main']
    alt-right = ['join-with right', 'mode main']


[workspace-to-monitor-force-assignment]
    1 = ['dell','hdr 4k','main']
    2 = ['dell','hdr 4k','main']
    3 = ['dell','hdr 4k','main']
    4 = ['dell','hdr 4k','main']
    5 = ['dell','hdr 4k','main']
    6 = ['built-in','secondary','main']
    7 = ['built-in','secondary','main']
    8 = ['built-in','secondary','main']
    9 = ['built-in','secondary','main']

[[on-window-detected]]
    if.app-id = 'com.microsoft.AzureVpnMac'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.microsoft.rdc.macos'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.hegenberg.BetterTouchTool'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.bankid.BankID'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.vorssaint.utils'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.tinycast.app'
    run = 'layout floating'

[[on-window-detected]]
#    if.window-title-regex-substring = '^Spotify$'
    if.app-id = 'com.spotify.client'
    run = 'move-node-to-workspace 5'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = 'move-node-to-workspace 4'