# Keychain registry — service names and the environment variables they populate.
# Contains no values of any kind. Safe to commit.
#
# Format: keychain-service|ENV_VAR [ENV_VAR ...]
#
# Sourced by:
#   environment-secrets.sh  — publishes these into the GUI login session at login
#   register-secret.sh      — interactive registration / rotation of the keychain items
#
# Non-secret values belong here too. `atlassian-user` holds an account email, not
# a credential — but this file is tracked and pushes to a public remote, so the
# value still cannot live in it. The keychain is the local, untracked store for
# anything that must not be committed, secret or merely personal.

SECRETS=(
  "orca-azure-devops-pat|ORCA_AZURE_DEVOPS_TOKEN AZURE_DEVOPS_PAT"
  "orca-launchdarkly-token|LAUNCHDARKLY_PAT"
  "atlassian-token|ATLASSIAN_PAT"
  "atlassian-user|ATLASSIAN_USER"
  "launchdarkly-dev-env|LD_DEV_ENV"
)
